<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NostrComments</title>
<style>
  :root { color-scheme: light dark; }
  body { width: 280px; margin: 0; padding: 14px 16px 16px;
         font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #fff; color: #222; }
  h1 { margin: 0 0 8px; font-size: 15px; font-weight: 700; color: #1d9bf0; }
  p { margin: 0 0 10px; }
  #hint { color: #6b6b6b; font-size: 12px; margin-bottom: 0; }
  button { width: 100%; padding: 10px; border: none; border-radius: 8px; cursor: pointer;
           background: linear-gradient(135deg, #1d9bf0, #0d8bf0); color: #fff;
           font-size: 13px; font-weight: 700; font-family: inherit; margin-bottom: 10px; }
  button:hover { opacity: .92; }
  button[hidden] { display: none; }
  button.secondary { background: none; color: #1d9bf0; border: 1px solid #1d9bf0; margin: 12px 0 0; font-weight: 600; }
  #reader { display: block; margin-top: 8px; font-size: 12px; color: #1d9bf0; }
  #reader[hidden] { display: none; }
  @media (prefers-color-scheme: dark) {
    body { background: #16181c; color: #e7e9ea; }
    #hint { color: #8b8b93; }
  }
</style>
</head>
<body>
<h1>NostrComments</h1>
<p id="status"></p>
<button id="open" hidden>Open comments on this page</button>
<button id="grant" hidden>Allow on all sites</button>
<p id="hint"></p>
<a id="reader" href="#" hidden>Read this page's comments on the web</a>
<button id="history" class="secondary">Your history</button>
<script src="popup.js"></script>
</body>
</html>
