<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NostrComments</title>
<style>
  :root { color-scheme: light dark; }
  body { width: 280px; margin: 0; padding: 14px 16px 16px;
         font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #fff; color: #222; }
  h1 { margin: 0 0 8px; font-size: 15px; font-weight: 700; color: #1d9bf0; }
  p { margin: 0 0 10px; }
  #hint { color: #6b6b6b; font-size: 12px; margin-bottom: 0; }
  button { width: 100%; padding: 10px; border: none; border-radius: 8px; cursor: pointer;
           background: linear-gradient(135deg, #1d9bf0, #0d8bf0); color: #fff;
           font-size: 13px; font-weight: 700; font-family: inherit; margin-bottom: 10px; }
  button:hover { opacity: .92; }
  button[hidden] { display: none; }
  button.secondary { background: none; color: #1d9bf0; border: 1px solid #1d9bf0; margin: 12px 0 0; font-weight: 600; }
  #reader { display: block; margin-top: 8px; font-size: 12px; color: #1d9bf0; }
  #reader[hidden] { display: none; }
  /* A toggle rather than a checkbox, like Attest's. Still a real checkbox underneath (role=switch),
     so the keyboard and screen readers handle it as before; only its look is drawn here. */
  .switch-row { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-weight: 600; cursor: pointer; user-select: none; }
  .switch { position: relative; flex: none; width: 36px; height: 20px; }
  .switch input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
  .switch .slider { position: absolute; inset: 0; border-radius: 20px; background: #b8bec6; transition: background-color .2s; pointer-events: none; }
  .switch .slider::before { content: ''; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .switch input:checked + .slider { background: #1d9bf0; }
  .switch input:checked + .slider::before { transform: translateX(16px); }
  .switch input:focus-visible + .slider { outline: 2px solid #1d9bf0; outline-offset: 2px; }
  @media (prefers-color-scheme: dark) {
    body { background: #16181c; color: #e7e9ea; }
    .switch .slider { background: #4a4f57; }
    #hint { color: #8b8b93; }
  }
</style>
</head>
<body>
<h1>NostrComments</h1>
<label class="switch-row"><span class="switch"><input type="checkbox" role="switch" id="enabled" checked><span class="slider"></span></span><span id="enabled-label">On</span></label>
<p id="status"></p>
<button id="open" hidden>Open comments on this page</button>
<button id="grant" hidden>Allow on all sites</button>
<p id="hint"></p>
<a id="reader" href="#" hidden>Read this page's comments on the web</a>
<button id="history" class="secondary">Your history</button>
<script src="popup.js"></script>
</body>
</html>
